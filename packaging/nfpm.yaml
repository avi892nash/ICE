# nfpm config for building the ice-demo .deb package.
# Run via packaging/scripts/build-deb.sh which substitutes ${VERSION}.
# Docs: https://nfpm.goreleaser.com/configuration/

name: ice-demo
# Architecture: all — the .deb contains only Node.js code (the Next.js
# standalone bundle); there are no compiled native binaries that bind it
# to amd64. Matches Thor's 'Architecture: all' for the same reason.
arch: all
platform: linux
version: ${VERSION}
version_schema: semver
section: web
priority: optional
maintainer: avi892nash <noreply@github.com>
description: |
  Interactive Connectivity Establishment (ICE) demo — a Next.js
  application that explains how WebRTC peer-to-peer connections work,
  with a live demo, candidate explorer, algorithm simulator, and a
  candid look at the limitations.
vendor: avi892nash
homepage: https://github.com/avi892nash/ICE
license: MIT

depends:
  # nodejs is the only hard runtime dep — adduser and systemd are
  # essentially pre-installed on every Debian/Ubuntu, and the postinst
  # already guards 'if [ -d /run/systemd/system ]' so absent-systemd
  # doesn't break the install. Matches Thor.
  - nodejs (>= 18)

contents:
  # Standalone Next.js server bundle.
  # `type: tree` is required so nfpm walks the directory recursively and
  # preserves the layout — without it, multiple files with the same
  # basename (e.g. _head.segment.rsc under different routes) collide at
  # the destination root.
  - src: .next/standalone
    dst: /opt/ice-demo
    type: tree

  # Static assets (Next.js doesn't copy these into standalone)
  - src: .next/static
    dst: /opt/ice-demo/.next/static
    type: tree

  # Public folder (favicons, images, og-image)
  - src: public
    dst: /opt/ice-demo/public
    type: tree

  # Systemd unit and auto-update timer
  - src: packaging/systemd/ice-demo.service
    dst: /lib/systemd/system/ice-demo.service
  - src: packaging/systemd/ice-demo-update.service
    dst: /lib/systemd/system/ice-demo-update.service
  - src: packaging/systemd/ice-demo-update.timer
    dst: /lib/systemd/system/ice-demo-update.timer

  # Auto-updater script — polls GitHub Releases API and installs newer .debs
  - src: packaging/scripts/ice-demo-update
    dst: /usr/bin/ice-demo-update
    file_info:
      mode: 0755

  # Default environment file (user-editable, marked as conffile)
  - src: packaging/etc/ice-demo.env
    dst: /etc/ice-demo/ice-demo.env
    type: config|noreplace

  # Bundled changelog so dpkg --changelog works
  - src: CHANGELOG.md
    dst: /usr/share/doc/ice-demo/CHANGELOG.md
    file_info:
      mode: 0644

scripts:
  postinstall: packaging/scripts/postinstall.sh
  preremove: packaging/scripts/preremove.sh
  postremove: packaging/scripts/postremove.sh

deb:
  fields:
    Bugs: https://github.com/avi892nash/ICE/issues
