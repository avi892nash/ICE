name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NFPM_VERSION: "2.46.3"
  NODE_VERSION: "20"

# Pipeline shape (PR):
#
#   commitlint
#   version ──► build-app ──► test-deb
#
# Pipeline shape (push to main, adds release):
#
#   version ──► build-app ──► test-deb ──► release
#
# Post-release (test-release.yml): on release published, the published
# .deb is downloaded, installed in a fresh runner, and smoke-tested.

jobs:
  # ---------------------------------------------------------------------------
  # Lint PR commit messages via the dedicated wagoid action — no npm ci needed
  # ---------------------------------------------------------------------------
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  # ---------------------------------------------------------------------------
  # Compute version string for build-app and for the release summary
  # ---------------------------------------------------------------------------
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.v.outputs.BASE }}
      full: ${{ steps.v.outputs.FULL }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHA=$(git rev-parse --short HEAD)
          echo "BASE=${BASE}"        >> $GITHUB_OUTPUT
          echo "FULL=${BASE}+${SHA}" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # Build the Next.js app + package as .deb via nfpm. Upload as artifact for
  # test-deb + release jobs to reuse — single build, no duplication.
  # ---------------------------------------------------------------------------
  build-app:
    name: Build .deb
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build

      - name: Install nfpm (pinned)
        run: |
          set -e
          url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          curl -fsSL "$url" -o nfpm.deb
          sudo dpkg -i nfpm.deb
          rm nfpm.deb

      - name: Build .deb
        # Use the FULL version (BASE+SHA, e.g. 2.0.1+4bdc7d8) so the .deb
        # control file reflects the exact commit the artifact was built
        # from. Mirrors Thor's build-server step.
        run: bash packaging/scripts/build-deb.sh ${{ needs.version.outputs.full }}

      - name: Normalize artifact filename to ice-demo.deb
        # nfpm names the file ice-demo_VERSION_all.deb (architecture: all);
        # glob both old amd64 and new all suffixes for transitional safety.
        run: cp dist/ice-demo_*.deb ice-demo.deb

      - uses: actions/upload-artifact@v4
        with:
          name: ice-demo-deb
          path: ice-demo.deb
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Install the built .deb on a clean runner + hit endpoints. Catches packaging
  # mistakes BEFORE we release.
  # ---------------------------------------------------------------------------
  test-deb:
    name: Smoke-test .deb
    runs-on: ubuntu-latest
    needs: build-app
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ice-demo-deb
          path: .

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install .deb
        run: sudo apt-get install -y ./ice-demo.deb

      - name: Verify package registered
        run: dpkg -s ice-demo | grep -E "^(Status|Version):"

      - name: Verify systemd units shipped
        run: |
          for f in /lib/systemd/system/ice-demo.service \
                   /lib/systemd/system/ice-demo-update.service \
                   /lib/systemd/system/ice-demo-update.timer; do
            [ -f "$f" ] || { echo "FAIL: $f missing"; exit 1; }
          done
          echo "PASS: all systemd units present"

      - name: Verify updater script shipped
        run: |
          [ -x /usr/bin/ice-demo-update ] || { echo "FAIL: /usr/bin/ice-demo-update missing or not executable"; exit 1; }
          echo "PASS: ice-demo-update present + executable"

      - name: Start server + smoke-test endpoints
        run: |
          NODE_ENV=production HOSTNAME=0.0.0.0 PORT=19877 \
            node /opt/ice-demo/server.js &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5 6; do
            sleep 1
            curl -sf -o /dev/null http://localhost:19877/ && break
          done

          fail() { echo "FAIL: $*"; exit 1; }

          HTTP=$(curl -s -o /tmp/home.html -w "%{http_code}" http://localhost:19877/)
          [ "$HTTP" = "200" ] || fail "/ returned $HTTP"
          grep -q "ICE Demo" /tmp/home.html || fail "/ did not contain 'ICE Demo'"

          for path in /algorithm /demo /candidates /limitations; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:19877$path")
            [ "$HTTP" = "200" ] || fail "$path returned $HTTP"
          done

          for path in /robots.txt /sitemap.xml /manifest.webmanifest; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:19877$path")
            [ "$HTTP" = "200" ] || fail "$path returned $HTTP"
          done

          HTTP=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:19877/og-image.png)
          [ "$HTTP" = "200" ] || fail "/og-image.png returned $HTTP"

          echo "PASS: server up, 9 endpoints OK"

  # ---------------------------------------------------------------------------
  # Release: downloads the artifact built earlier (no rebuild) and lets
  # semantic-release attach it via @semantic-release/github. Matches Thor's
  # release-uses-artifact-directly pattern.
  # ---------------------------------------------------------------------------
  release:
    name: Release v${{ needs.version.outputs.full }}
    runs-on: ubuntu-latest
    needs: [version, test-deb]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install release tooling
        run: npm ci --no-audit --no-fund

      - name: Download .deb artifact built earlier
        uses: actions/download-artifact@v4
        with:
          name: ice-demo-deb
          path: dist/

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Summary
        run: |
          echo "======================================="
          echo "  ICE pipeline summary"
          echo "======================================="
          echo "  Version computed: ${{ needs.version.outputs.full }}"
          echo "  Commit:           ${{ github.sha }}"
          echo "  Artifact:         dist/ice-demo.deb"
          echo "======================================="
