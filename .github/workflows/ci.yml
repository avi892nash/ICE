name: Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Bump when nfpm releases a fix you want. /releases/latest/download/
  # asset URLs are versioned — the unversioned shortcut 404s.
  NFPM_VERSION: "2.46.3"

jobs:
  pipeline:
    name: Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint PR commit messages
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build

      - name: Install nfpm (pinned)
        if: github.event_name == 'push'
        run: |
          set -e
          url="https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          curl -fsSL "$url" -o nfpm.deb
          file nfpm.deb
          sudo dpkg -i nfpm.deb
          rm nfpm.deb
          nfpm --version

      - name: Run semantic-release
        if: github.event_name == 'push'
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/exec@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize release decision
        if: github.event_name == 'push'
        run: |
          if [ "${{ steps.semrel.outputs.new_release_published }}" = "true" ]; then
            echo "::notice::Released v${{ steps.semrel.outputs.new_release_version }} — .deb attached to GitHub Release"
          else
            echo "::notice::No release this run — no commits triggered a version bump"
          fi
