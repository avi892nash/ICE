name: Test Published Release

# `release: published` is what we'd ideally fire on, but GitHub deliberately
# does NOT trigger downstream workflows for events created by GITHUB_TOKEN
# (which is what semantic-release uses). So a fresh release published by the
# Pipeline workflow won't auto-trigger this one. Two workarounds shipped:
#   1. workflow_dispatch — run manually from the Actions UI or via
#      `gh workflow run test-release.yml -f tag=v1.2.0`.
#   2. (alternative, not used here) replace GITHUB_TOKEN in the release job
#      with a PAT that has `repo` scope.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to smoke-test (e.g. v1.2.0). Defaults to latest."
        required: false
        type: string

jobs:
  test-published-deb:
    name: Install & smoke-test published .deb
    runs-on: ubuntu-latest
    steps:
      - name: Resolve target tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Targeting release: $TAG"

      - name: Download ice-demo deb from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Accept both the new stable name (ice-demo_amd64.deb, from v1.2.1+)
          # and the legacy versioned name (ice-demo_X.Y.Z_amd64.deb, ≤ v1.2.0)
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "ice-demo*amd64.deb" \
            --output ice-demo.deb

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install .deb
        run: sudo apt-get install -y ./ice-demo.deb

      - name: Verify package registered
        run: dpkg -s ice-demo | grep -E "^(Status|Version):"

      - name: Smoke-test the published binary
        run: |
          NODE_ENV=production HOSTNAME=0.0.0.0 PORT=19877 \
            node /opt/ice-demo/server.js &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5 6; do
            sleep 1
            curl -sf -o /dev/null http://localhost:19877/ && break
          done

          fail() { echo "FAIL: $*"; exit 1; }

          HTTP=$(curl -s -o /tmp/home.html -w "%{http_code}" http://localhost:19877/)
          [ "$HTTP" = "200" ] || fail "/ returned $HTTP"
          grep -q "ICE Demo" /tmp/home.html || fail "/ did not contain 'ICE Demo'"

          for path in /algorithm /demo /candidates /limitations; do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:19877$path")
            [ "$HTTP" = "200" ] || fail "$path returned $HTTP"
          done

          echo "PASS: published .deb installs and serves all pages"

      - name: Verify updater regex finds the asset (matches /usr/bin/ice-demo-update)
        run: |
          API="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          DEB_NAME=$(curl -fsSL -H "Accept: application/vnd.github+json" "$API" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s);process.stdout.write((r.assets||[]).map(a=>a.name).find(n=>/^ice-demo(_\\d+\\.\\d+\\.\\d+)?_amd64\\.deb$/.test(n))||'')}")
          [ -n "$DEB_NAME" ] || { echo "FAIL: latest release has no ice-demo_amd64.deb asset"; exit 1; }
          echo "PASS: ice-demo-update will see asset '$DEB_NAME'"
